version: "2"
sql:
  - engine: postgresql
    schema: [migrations/core, migrations/identity]
    queries: internal/repo/postgres/queries
    gen:
      go:
        package: sqlcgen
        out: internal/repo/postgres/sqlcgen
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_result_struct_pointers: true
        overrides:
          - db_type: uuid
            go_type: uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              type: uuid.UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
