# Redis（缓存、限流、吊销键、幂等键）
#
# 用法：叠加在 docker-compose.base.yaml 之上

x-redis-env: &redis-env
  REDIS_URL: redis://redis:6379/0

services:
  redis:
    image: redis:8.10.3-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '256mb', '--maxmemory-policy', 'noeviction']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s

  api:
    environment: *redis-env
    depends_on:
      redis:
        condition: service_healthy

  worker:
    environment: *redis-env
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
