# 测试环境：从源码构建镜像，APP_ENV=test，Mailpit 收信，种子数据一次性写入；供手工联调，完整 e2e 用 make test-e2e
#
# 用法：
#   docker compose -f docker/docker-compose.base.yaml -f docker/docker-compose.redis.yaml -f docker/docker-compose.postgres.yaml -f docker/docker-compose.test.yaml up --build --wait

name: go-template-test

x-test-env: &test-env
  APP_ENV: test
  SMTP_URL: smtp://mailpit:1025?tls=none
  APP_FRONTEND_URL: http://localhost:5173

services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '${MAIL_CLIENT_PORT:-1080}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 1s

  migrate:
    environment: *test-env

  seed:
    image: go-template:local
    pull_policy: never
    env_file:
      - ../.env.example
    command: ['seed']
    restart: 'no'
    environment:
      <<: *test-env
      DATABASE_URL: postgresql://${DATABASE_USERNAME:-root}:${DATABASE_PASSWORD:-secret}@postgres:5432/${DATABASE_NAME:-api}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    environment: *test-env
    depends_on:
      seed:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy

  worker:
    environment: *test-env
    depends_on:
      seed:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
