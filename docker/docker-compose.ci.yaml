# CI / e2e：生产镜像以 APP_ENV=production 起完整服务栈，演示账号由 seed 一次性写入
#
# 用法：make test-e2e

x-ci-env: &ci-env
  APP_ENV: production
  AUTH_JWT_SECRET: ci_jwt_secret_0123456789abcdefghijklmnop
  AUTH_REFRESH_SECRET: ci_refresh_secret_0123456789abcdefghijklmnop
  AUTH_FORGOT_SECRET: ci_forgot_secret_0123456789abcdefghijklmnop
  AUTH_CONFIRM_EMAIL_SECRET: ci_confirm_email_secret_0123456789abcdefghijklmnop
  SWAGGER_ENABLED: 'true'
  REDIS_ENABLED: 'true'
  TRUST_PROXY: '1'
  MAIL_HOST: localhost
  MAIL_PORT: '1025'
  MAIL_DEFAULT_EMAIL: noreply@example.com
  MAIL_DEFAULT_NAME: API

services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  migrate:
    environment: *ci-env

  seed:
    image: go-template:local
    pull_policy: never
    env_file:
      - ../.env.example
    command: ['seed']
    restart: 'no'
    environment:
      <<: *ci-env
      APP_ENV: test
      DATABASE_HOST: postgres
      REDIS_ENABLED: 'true'
      REDIS_HOST: redis
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    ports: !override
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    environment: *ci-env
    depends_on:
      seed:
        condition: service_completed_successfully

  worker:
    environment: *ci-env
    depends_on:
      seed:
        condition: service_completed_successfully
