# CI / e2e：生产镜像以 APP_ENV=production 起完整服务栈；AUTH_SIGNING_KEY 为 e2e 用例共用的固定测试密钥，邮件发往 Mailpit，短信账号为占位值（e2e 不发短信），local 驱动的文件目录由 api 与 worker 共享（卷 uploaded-files）
#
# 用法：make test-e2e

x-ci-env: &ci-env
  APP_ENV: production
  DOCS_ENABLED: 'true'
  LOG_FORMAT: json
  LOG_LEVEL: info
  CORS_ORIGINS: http://localhost:5173
  TRUSTED_PROXIES: '1'
  METRICS_TOKEN: ci-metrics-token-0123456789
  REDIS_URL: redis://redis:6379/0
  APP_FRONTEND_URL: http://localhost:5173
  SMTP_URL: smtp://mailpit:1025?tls=none
  MAIL_FROM: no-reply@example.com
  SMS_PROVIDER: aliyun
  ALIYUN_SMS_ACCESS_KEY_ID: ci
  ALIYUN_SMS_ACCESS_KEY_SECRET: ci
  ALIYUN_SMS_SIGN_NAME: ci
  ALIYUN_SMS_TEMPLATE_CODE: ci
  ALIYUN_SMS_ENDPOINT: http://127.0.0.1:9
  STORAGE_DRIVER: local
  STORAGE_LOCAL_ROOT: /home/nonroot/files
  FILE_URL_SECRET: ci_file_url_secret_0123456789abcdef
  AUTH_ISSUER: go-template-e2e
  AUTH_AUDIENCE: go-template-e2e
  AUTH_SIGNING_KEY: |
    -----BEGIN PRIVATE KEY-----
    MC4CAQAwBQYDK2VwBCIEIAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8g
    -----END PRIVATE KEY-----

services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:${MAILPIT_PORT:-18025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    environment: *ci-env

  seed:
    image: go-template:local
    pull_policy: never
    env_file:
      - ../.env.example
    command: ['seed']
    restart: 'no'
    environment:
      <<: *ci-env
      APP_ENV: test
      DATABASE_URL: postgresql://${DATABASE_USERNAME:-root}:${DATABASE_PASSWORD:-secret}@postgres:5432/${DATABASE_NAME:-api}?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    ports: !override
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    environment: *ci-env
    volumes:
      - uploaded-files:/home/nonroot
    depends_on:
      seed:
        condition: service_completed_successfully

  worker:
    environment: *ci-env
    volumes:
      - uploaded-files:/home/nonroot
    depends_on:
      seed:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy

volumes:
  uploaded-files:
