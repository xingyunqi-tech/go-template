overlay: 1.0.0
info:
  title: go-template codegen overlay
  version: 1.0.0
actions:
  - target: $.paths.*.*.parameters[?(@.in == 'path' && @.schema.type == 'number')].schema
    update:
      x-go-type: int32
  - target: $.paths.*.*.parameters[?(@.in == 'header' && @.name == 'Accept-Language')]
    remove: true
  - target: $.paths['/api/health'].get.responses['200'].content['application/json'].schema
    update:
      x-go-type: view.HealthCheck
      x-go-type-import:
        path: github.com/xingyunqi-tech/go-template/internal/controller/http/v1/view
  - target: $.components.schemas.User
    update:
      x-go-type: view.User
      x-go-type-import:
        path: github.com/xingyunqi-tech/go-template/internal/controller/http/v1/view
  - target: $.components.schemas.LoginResponseDto
    update:
      x-go-type: view.Login
      x-go-type-import:
        path: github.com/xingyunqi-tech/go-template/internal/controller/http/v1/view
  - target: $.components.schemas.RefreshResponseDto
    update:
      x-go-type: view.Refresh
      x-go-type-import:
        path: github.com/xingyunqi-tech/go-template/internal/controller/http/v1/view
  - target: $.components.schemas.SessionResponseDto
    update:
      x-go-type: view.Session
      x-go-type-import:
        path: github.com/xingyunqi-tech/go-template/internal/controller/http/v1/view
  - target: $.components.schemas.InfinityPaginationUserResponseDto
    update:
      x-go-type: view.UserPage
      x-go-type-import:
        path: github.com/xingyunqi-tech/go-template/internal/controller/http/v1/view
  - target: $.components.schemas.AuthUpdateDto
    update:
      x-go-type: any
  - target: $.components.schemas.AuthRegisterLoginDto
    update:
      x-go-type: any
  - target: $.components.schemas.CreateUserDto
    update:
      x-go-type: any
  - target: $.components.schemas.UpdateUserDto
    update:
      x-go-type: any
  - target: $.components.schemas.AuthDeleteAccountDto
    update:
      x-go-type: any
  - target: $.paths['/api/v1/health'].get.responses['200'].content['application/json'].schema
    update:
      x-go-type: view.Health
      x-go-type-import:
        path: github.com/xingyunqi-tech/go-template/internal/controller/http/v1/view
  - target: $.paths['/api/v1/health/live'].get.responses['200'].content['application/json'].schema
    update:
      x-go-type: view.Health
      x-go-type-import:
        path: github.com/xingyunqi-tech/go-template/internal/controller/http/v1/view
  - target: $.paths['/api/v1/health/ready'].get.responses['200'].content['application/json'].schema
    update:
      x-go-type: view.Health
      x-go-type-import:
        path: github.com/xingyunqi-tech/go-template/internal/controller/http/v1/view
  - target: $.paths['/api/v1/files/upload'].post.requestBody
    remove: true
  - target: $.paths['/api/v1/files/upload'].post.responses['201'].content['application/json'].schema
    update:
      x-go-type: view.Upload
      x-go-type-import:
        path: github.com/xingyunqi-tech/go-template/internal/controller/http/v1/view
