# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/v2.8.2/configuration-schema.json
package: gen
output: internal/controller/http/gen/gen.go
generate:
  models: true
  chi-server: true
  strict-server: true
compatibility:
  apply-chi-middleware-first-to-last: true
output-options:
  skip-prune: true
  type-mapping:
    string:
      formats:
        date-time:
          type: jsontime.Time
          import: github.com/xingyunqi-tech/go-template/pkg/jsontime
        uuid:
          type: uuid.UUID
          import: uuid
