paths:
  /api/v1/me:
    get:
      operationId: getMe
      tags:
      - me
      summary: Get the current user
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Get the current user
          x-envelope: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateMe
      tags:
      - me
      summary: Update the current user
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeInput'
      responses:
        '200':
          description: Update the current user
          x-envelope: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/me/password:
    put:
      operationId: changePassword
      tags:
      - me
      summary: Change the password
      description: Signs the other sessions out. currentPassword is required once a password is set; without one, a recent
        sign-in is required.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordInput'
      responses:
        '200':
          description: Change the password
          x-envelope: true
          content:
            application/json:
              schema:
                type: 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/me/sessions:
    get:
      operationId: listMySessions
      tags:
      - me
      summary: List the active sessions
      security:
      - bearerAuth: []
      responses:
        '200':
          description: List the active sessions
          x-envelope: true
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me/sessions/{id}:
    parameters:
    - $ref: '#/components/parameters/SessionID'
    delete:
      operationId: revokeMySession
      tags:
      - me
      summary: Revoke a session
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Revoke a session
          x-envelope: true
          content:
            application/json:
              schema:
                type: 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/me/sessions/revoke-others:
    post:
      operationId: revokeOtherSessions
      tags:
      - me
      summary: Revoke every session but the current one
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Revoke every session but the current one
          x-envelope: true
          content:
            application/json:
              schema:
                type: 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
