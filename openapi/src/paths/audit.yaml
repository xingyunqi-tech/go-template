paths:
  /api/v1/audit-logs:
    get:
      operationId: listAuditLogs
      tags:
      - audit
      summary: List the audit logs, newest first
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - name: actorSub
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: action
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 100
      responses:
        '200':
          description: A page of audit logs
          x-envelope: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
