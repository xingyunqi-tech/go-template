components:
  schemas:
    LoginResponse:
      type: object
      required: [accessToken, refreshToken, expiresIn, tokenType, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Seconds until the access token expires
        tokenType:
          type: string
          enum: [Bearer]
        user:
          $ref: '#/components/schemas/User'
    RegisterInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          $ref: '#/components/schemas/Password'
        displayName:
          $ref: '#/components/schemas/DisplayName'
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
    TokenInput:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 256
    EmailInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    ResetPasswordInput:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 256
        password:
          $ref: '#/components/schemas/Password'
    RefreshInput:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1
          maxLength: 256
    Phone:
      type: string
      minLength: 1
      maxLength: 32
      description: E.164, or an 11-digit mainland China number
    SmsCode:
      type: string
      pattern: '^[0-9]{6}$'
    SendSmsCodeInput:
      type: object
      required: [phone, scene]
      properties:
        phone:
          $ref: '#/components/schemas/Phone'
        scene:
          type: string
          enum: [login, bind_phone]
    SmsLoginInput:
      type: object
      required: [phone, code]
      properties:
        phone:
          $ref: '#/components/schemas/Phone'
        code:
          $ref: '#/components/schemas/SmsCode'
    AuthProvider:
      type: object
      required: [id]
      properties:
        id:
          type: string
    ProviderLoginInput:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 512
  parameters:
    Provider:
      name: provider
      in: path
      required: true
      description: wechat_miniapp, wechat_app or alipay
      schema:
        type: string
        minLength: 1
        maxLength: 32
