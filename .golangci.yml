version: "2"

run:
  build-tags:
    - integration
    - e2e
    - contract

linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - contextcheck
    - copyloopvar
    - cyclop
    - depguard
    - dogsled
    - dupl
    - durationcheck
    - err113
    - errcheck
    - errorlint
    - exhaustive
    - exhaustruct_v5
    - forbidigo
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - godox
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - makezero
    - misspell
    - mnd
    - nakedret
    - nestif
    - nlreturn
    - noctx
    - nolintlint
    - paralleltest
    - predeclared
    - revive
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - staticcheck
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - whitespace
    - wsl_v5
  settings:
    depguard:
      rules:
        entity:
          files:
            - "**/internal/entity/**"
          deny:
            - pkg: github.com/jackc/pgx
              desc: entity 不依赖数据库驱动
            - pkg: github.com/xingyunqi-tech/go-template/internal/controller
              desc: entity 不依赖 controller 与生成代码
            - pkg: net/http
              desc: entity 不依赖 HTTP
        usecase:
          files:
            - "**/internal/usecase/**"
          deny:
            - pkg: github.com/xingyunqi-tech/go-template/internal/controller
              desc: usecase 不依赖 controller
        repo:
          files:
            - "**/internal/repo/**"
          deny:
            - pkg: github.com/xingyunqi-tech/go-template/internal/controller
              desc: repo 不依赖 controller
            - pkg: github.com/xingyunqi-tech/go-template/internal/usecase
              desc: repo 不依赖 usecase
        pkg:
          files:
            - "**/pkg/**"
            - "!$test"
          deny:
            - pkg: github.com/xingyunqi-tech/go-template/internal
              desc: pkg 与业务无关，不引用 internal
    dupl:
      threshold: 100
    errcheck:
      check-type-assertions: true
      check-blank: false
    errorlint:
      errorf: true
    exhaustive:
      default-signifies-exhaustive: false
    exhaustruct_v5:
      explicit-mode: true
      enforce-patterns:
        - ^github\.com/xingyunqi-tech/go-template/internal/config\.
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^fmt\.Print(f|ln)?$
          msg: 用 slog 输出日志
        - pattern: ^log\.(Print|Fatal|Panic)(f|ln)?$
          msg: 用 slog 输出日志
        - pattern: ^os\.(Getenv|LookupEnv)$
          msg: 配置只从 config.Config 读取
    funlen:
      lines: 65
      statements: 40
    gocognit:
      min-complexity: 15
    goconst:
      min-len: 2
      min-occurrences: 5
    gocritic:
      disabled-checks:
        - dupImport
        - unnecessaryBlock
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    gocyclo:
      min-complexity: 10
    misspell:
      locale: US
    nestif:
      min-complexity: 4
    nolintlint:
      require-explanation: true
      require-specific: true
    sloglint:
      kv-only: true
      context: scope
      static-msg: true
      key-naming-case: snake
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
  exclusions:
    generated: strict
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - dupl
          - err113
          - exhaustruct_v5
          - funlen
          - goconst
          - mnd
      - path: (internal/config|internal/testutil|tests)/
        text: os\.(Getenv|LookupEnv)
        linters:
          - forbidigo
      - path: tools/
        linters:
          - forbidigo
      - path: internal/controller/http/policy\.go
        linters:
          - mnd
      - path: pkg/ratelimit/rules\.go
        linters:
          - mnd
      - path: internal/entity/errors\.go
        text: G101
        linters:
          - gosec
      - path: tests/
        text: G70[23]
        linters:
          - gosec
    paths:
      - bin/

formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
  exclusions:
    generated: strict
    paths:
      - bin/
